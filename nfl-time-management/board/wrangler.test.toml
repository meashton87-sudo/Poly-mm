# The test server's worker (.github/workflows/test-site.yml): the board's code from any branch under another name, so
# its Durable Objects (lobby, rooms, ladder, board) are its own and nothing reaches the real board, ladder or players.
# No cron, no secrets (no accounts, no mail, no payments), any origin; only the engine's assets (assets/vs). It stays up
# between runs (the next run replaces it); its data is the test's own.
name = "two-minute-drill-test"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
ALLOWED_ORIGINS = "*"
SITE = "https://nfl2mindrill-test.pages.dev"

[assets]
directory = "./assets-test"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Match"]
