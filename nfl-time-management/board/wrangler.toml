# The website's backend (board/worker.js): the survivor leaderboard and the daily game's stats. Deploy:
# `npx wrangler deploy` (or the board workflow in .github/workflows/board.yml). Everything lives in one SQLite-backed
# Durable Object, which the Workers free plan includes; nothing to create first. Optional:
# `npx wrangler secret put ADMIN_TOKEN` turns on removing rows.
name = "two-minute-drill-board"
main = "worker.js"
compatibility_date = "2025-06-01"

# Pro purchases: `npx wrangler secret put STRIPE_SECRET` (the Stripe secret key, sk_live_...), then STRIPE_PRICE below
# (the one-time price id, price_...) and SITE (where Stripe sends the buyer back). Without them /pay answers 503.
[vars]
ALLOWED_ORIGINS = "https://nfl2mindrill.com,https://www.nfl2mindrill.com,https://nfl2mindrill.pages.dev,https://nfl2mindrill-pro-preview.pages.dev"
SITE = "https://nfl2mindrill.com"
STRIPE_PRICE = "prod_VRryrvDrQxpAC7"      # test mode: Two-Minute Drill Pro, $4.99 (the live product's id replaces it at launch)

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]
