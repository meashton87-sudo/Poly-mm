# The website's backend (board/worker.js): the survivor leaderboard and the daily game's stats. Deploy:
# `npx wrangler deploy` (or the board workflow in .github/workflows/board.yml). Everything lives in one SQLite-backed
# Durable Object, which the Workers free plan includes; nothing to create first. Optional:
# `npx wrangler secret put ADMIN_TOKEN` turns on removing rows.
name = "two-minute-drill-board"
main = "worker.js"
compatibility_date = "2025-06-01"
keep_vars = true        # a deploy keeps plain variables set in the Cloudflare dashboard (secrets always survive)

# Pro purchases: the secret STRIPE_SECRET (a restricted Stripe key, Checkout Sessions write; set in the Cloudflare
# dashboard) turns them on. STRIPE_PRICE is optional: a price id (price_...) or a product id (prod_...) from the
# catalog; left empty, the worker describes the product itself and charges $4.99. SITE is where Stripe sends the
# buyer back when the request came from nowhere known. Without the key /pay answers 503.
[vars]
ALLOWED_ORIGINS = "https://nfl2mindrill.com,https://www.nfl2mindrill.com,https://nfl2mindrill.pages.dev,https://nfl2mindrill-pro-preview.pages.dev"
SITE = "https://nfl2mindrill.com"
# Accounts (worker.js /auth*): GOOGLE_CLIENT_ID (public; the same id the site's page names) turns on Sign in with
# Google; email sign-in links need the secret RESEND_KEY and the var MAIL_FROM (e.g. "Two-Minute Drill
# <signin@nfl2mindrill.com>", a domain verified in Resend); without them those answer 503 and the page hides them.
GOOGLE_CLIENT_ID = "1079340119845-i8p0d0c57dmoa1hluqkm15ofi33oe9ms.apps.googleusercontent.com"
# The Gauntlet (worker.js /race*), optional, set in the dashboard (keep_vars keeps them): RACE_FROM (its start, ISO),
# RACE_TO (its end, ISO: no pass counts after it, and the page shows the final results) and NEXT_CONTEST (a line about
# the next contest, shown with the results; empty: hidden). The admin page (/admin.html) needs the ADMIN_TOKEN secret.
RACE_TO = "2026-10-17T00:45:00Z"           # the first Gauntlet ended 8:45 pm Eastern, Oct 16 2026 (the owner called it)
STRIPE_PRICE = "prod_VRryrvDrQxpAC7"      # the live product (Two-Minute Drill Pro; its category carries the tax code Managed Payments needs), charged $4.99
# The daily email (worker.js reminders: accounts that ask for it) goes out by Resend too, so it needs the same RESEND_KEY
# and MAIL_FROM. Optional: API_URL, this worker's own address (https://...workers.dev, or its custom domain), adds the
# one-click unsubscribe header mail apps show; MAIL_SECRET (a secret) fixes the key behind the unsubscribe links (else
# one is made and kept in storage); REMIND_CAP, the most emails a run sends (1000 when unset).

# The daily email's runs: the new daily goes live at local midnight (game.js dayOf), and 08:05 UTC is past midnight in
# every mainland US time zone, summer or winter; the two later runs send what a refused batch or a run's cap left (one a
# day each)
[triggers]
crons = ["5 8-10 * * *"]

# The Pro data (board/assets/pro, put there by the site workflow): never served as plain files (run_worker_first), only
# by the worker to a valid Pro code (POST /pro/data)
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Match"]
