<title>Two-Minute Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column like a daily puzzle. Header, three spot tiles, the scoreboard, a portrait
   field (offense always driving up the screen, every player a percentile chip), and the play-call
   keyboard under it. Color comes from the field itself: turf, chalk, the blue line of scrimmage and the
   yellow first-down line. */
:root {
  --paper: #f4f6f3; --card: #ffffff; --ink: #121a15; --muted: #5a675e; --line: #d3dbd5;
  --key: #dde3de; --key-hi: #cfd7d1; --key-ink: #121a15;
  --turf: #2e7a4d; --turf-2: #2a7046; --chalk: rgba(255, 255, 255, .82); --chalk-soft: rgba(255, 255, 255, .34);
  --chain: #f4c400; --chain-ink: #1d1700; --los: #3b7cf0;
  --t-e: #138a4a; --t-g: #74c27a; --t-a: #a9b2ab; --t-b: #ef9a3c; --t-p: #db463e;
  --t-e-ink: #ffffff; --t-g-ink: #0d2412; --t-a-ink: #18211b; --t-b-ink: #2a1600; --t-p-ink: #ffffff;
  --sq-g: #3d9a56; --sq-y: #d2ad2e; --sq-o: #e27c37; --sq-r: #d0463f; --sq-ink: #ffffff;
  --shade: rgba(10, 18, 13, .55);
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d120f; --card: #151c17; --ink: #e8eee9; --muted: #98a59c; --line: #29342d;
  --key: #2b3530; --key-hi: #36423b; --key-ink: #e8eee9;
  --turf: #215a39; --turf-2: #1e5234; --chalk: rgba(255, 255, 255, .74); --chalk-soft: rgba(255, 255, 255, .26);
  --chain: #f2c200; --chain-ink: #1d1700; --los: #5b93f5;
  --t-e: #1c9a55; --t-g: #6cb873; --t-a: #77827a; --t-b: #e08a2c; --t-p: #d24a42;
  --t-e-ink: #ffffff; --t-g-ink: #0d2412; --t-a-ink: #0e1510; --t-b-ink: #1f1000; --t-p-ink: #ffffff;
  --sq-g: #3a8f51; --sq-y: #b9992a; --sq-o: #cc6d2e; --sq-r: #c0403a; --sq-ink: #ffffff;
  --shade: rgba(0, 0, 0, .66);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0d120f; --card: #151c17; --ink: #e8eee9; --muted: #98a59c; --line: #29342d;
  --key: #2b3530; --key-hi: #36423b; --key-ink: #e8eee9;
  --turf: #215a39; --turf-2: #1e5234; --chalk: rgba(255, 255, 255, .74); --chalk-soft: rgba(255, 255, 255, .26);
  --chain: #f2c200; --chain-ink: #1d1700; --los: #5b93f5;
  --t-e: #1c9a55; --t-g: #6cb873; --t-a: #77827a; --t-b: #e08a2c; --t-p: #d24a42;
  --t-e-ink: #ffffff; --t-g-ink: #0d2412; --t-a-ink: #0e1510; --t-b-ink: #1f1000; --t-p-ink: #ffffff;
  --sq-g: #3a8f51; --sq-y: #b9992a; --sq-o: #cc6d2e; --sq-r: #c0403a; --sq-ink: #ffffff;
  --shade: rgba(0, 0, 0, .66);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 3px solid var(--los); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .in { max-width: 500px; margin: 0 auto; padding: 8px 16px; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; }
.top h1 { margin: 0; text-align: center; font: 900 30px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.top h1 small { display: block; font: 600 11px/1.3 var(--body); letter-spacing: .14em; color: var(--muted); margin-top: 2px; }
.icon { width: 40px; height: 40px; border: 0; background: none; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon:hover { background: var(--key); }
.icon svg { width: 24px; height: 24px; }

.wrap { max-width: 500px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 32px; display: flex; flex-direction: column; gap: 10px; }

/* the three spots of the day */
.tiles { display: flex; justify-content: center; gap: 6px; }
.tiles button { width: 34px; height: 34px; border: 2px solid var(--line); border-radius: 4px; background: transparent; font: 800 16px var(--display); color: var(--muted); display: grid; place-items: center; cursor: default; padding: 0; }
.tiles button.on { border-color: var(--ink); color: var(--ink); }
.tiles button.done { border-color: transparent; color: var(--sq-ink); }
.spothead { text-align: center; display: grid; gap: 2px; }
.spothead .cat { font: 700 11px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.spothead .who { font-weight: 600; font-size: 15px; text-wrap: balance; }

/* scoreboard */
.board { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px 9px; display: grid; gap: 4px; cursor: pointer; text-align: left; }
.board:hover { border-color: var(--muted); }
.board .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.tm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tm.r { flex-direction: row-reverse; text-align: right; }
.tm .sw { width: 6px; align-self: stretch; border-radius: 3px; flex: none; }
.tm .ab { font: 800 22px/1 var(--display); letter-spacing: .02em; }
.tm .meta { display: grid; gap: 3px; min-width: 0; }
.board span { display: block; }
.board .tm, .board .tos { display: flex; }
.board .row, .board .meta, .board .clk { display: grid; }
.board .tos i { display: inline-block; }
.tm .tos { display: flex; gap: 3px; }
.tm.r .tos { justify-content: flex-end; }
.tm .tos i { width: 12px; height: 4px; border-radius: 2px; background: var(--chain); }
.tm .tos i.used { background: var(--line); }
.tm .sc { font: 900 34px/1 var(--display); font-variant-numeric: tabular-nums; margin-left: auto; }
.tm.r .sc { margin-left: 0; margin-right: auto; }
.tm .you { font: 700 9px var(--body); letter-spacing: .14em; color: var(--muted); }
.tm .poss { width: 11px; height: 7px; border-radius: 50%; background: #8a4b24; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); flex: none; }
.clk { text-align: center; display: grid; }
.clk .q { font: 700 11px var(--body); letter-spacing: .12em; color: var(--muted); }
.clk .t { font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.clk .t.run { color: var(--sq-g); }
.dd { text-align: center; font-weight: 600; font-size: 14px; color: var(--muted); }
.dd b { color: var(--ink); }

/* the field */
.fieldwrap { border-radius: 10px; overflow: hidden; background: var(--turf); line-height: 0; }
#field { width: 100%; height: auto; display: block; }
#field .pl { cursor: pointer; }
#field .pl circle { stroke: rgba(0,0,0,.28); stroke-width: 1; }
#field .pl.me circle { stroke: var(--chalk); stroke-width: 1.6; }
#field .pl:hover circle, #field .pl:focus circle { stroke: var(--chain); stroke-width: 2.6; }
#field .pl:focus { outline: none; }
#field .pl .n { font: 800 11px var(--body); font-variant-numeric: tabular-nums; pointer-events: none; }
#field .pl .pos { font: 700 8px var(--body); letter-spacing: .06em; fill: var(--chalk); pointer-events: none; }
#field .t-e circle { fill: var(--t-e); } #field .t-e .n { fill: var(--t-e-ink); }
#field .t-g circle { fill: var(--t-g); } #field .t-g .n { fill: var(--t-g-ink); }
#field .t-a circle { fill: var(--t-a); } #field .t-a .n { fill: var(--t-a-ink); }
#field .t-b circle { fill: var(--t-b); } #field .t-b .n { fill: var(--t-b-ink); }
#field .t-p circle { fill: var(--t-p); } #field .t-p .n { fill: var(--t-p-ink); }
#field .num { font: 800 17px var(--display); fill: var(--chalk); }
#field .ez { font: 900 24px var(--display); letter-spacing: .18em; fill: var(--chalk); }
#field .tag { font: 700 9px var(--body); letter-spacing: .1em; }
#field .big { font: 900 30px var(--display); letter-spacing: .12em; fill: var(--chalk); }
.legend { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* the play-call keyboard */
.call { display: grid; gap: 10px; min-height: 196px; align-content: start; }
.ask { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ask h2 { margin: 0; font: 800 15px var(--body); letter-spacing: .1em; text-transform: uppercase; }
.ask .sub { font-size: 13px; color: var(--muted); }
.keys { display: grid; gap: 6px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
.key { border: 0; border-radius: 6px; background: var(--key); color: var(--key-ink); min-height: 50px; padding: 6px 4px; cursor: pointer;
  font: 800 14px/1.1 var(--body); letter-spacing: .05em; text-transform: uppercase; display: grid; place-items: center; align-content: center; gap: 2px; text-align: center; }
.key:hover { background: var(--key-hi); }
.key small { font: 600 10.5px var(--body); letter-spacing: .04em; text-transform: none; color: var(--muted); }
.key.big { min-height: 66px; font: 900 26px/1 var(--display); letter-spacing: .06em; }
.key.sel, .key[aria-pressed="true"] { background: var(--chain); color: var(--chain-ink); }
.key.sel small, .key[aria-pressed="true"] small { color: var(--chain-ink); }
.key:disabled { opacity: .45; cursor: default; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.plays { display: grid; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .lab { font-weight: 700; font-size: 15px; min-width: 0; }
.prow .sides { display: flex; gap: 5px; }
.prow .key { min-height: 42px; min-width: 66px; padding-inline: 8px; font-size: 13px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); }
.toggle .lab { font-weight: 600; font-size: 14px; }
.toggle .lab small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.sw2 { width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; }
.sw2::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sw2[aria-checked="true"] { background: var(--sq-g); }
.sw2[aria-checked="true"]::after { left: 21px; }
.status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; min-height: 50px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* result of a snap */
.result { display: grid; gap: 10px; }
.res-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.sq { width: 48px; height: 48px; border-radius: 4px; display: grid; place-items: center; font: 900 22px var(--display); color: var(--sq-ink); }
.sq.g { background: var(--sq-g); } .sq.y { background: var(--sq-y); } .sq.o { background: var(--sq-o); } .sq.r { background: var(--sq-r); }
.flip { animation: flip .55s ease-out both; }
@keyframes flip { 0% { transform: rotateX(90deg); } 60% { transform: rotateX(-12deg); } 100% { transform: rotateX(0); } }
.res-play { font-weight: 600; font-size: 14.5px; line-height: 1.35; text-wrap: pretty; }
.res-play .yd { font: 900 22px/1.05 var(--display); letter-spacing: .03em; display: block; text-transform: uppercase; margin-bottom: 2px; }
.verdict { font-size: 14px; color: var(--muted); }
.verdict b { color: var(--ink); }
.btn { border: 0; border-radius: 8px; background: var(--ink); color: var(--paper); min-height: 50px; padding: 0 18px; font: 800 15px var(--body); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; width: 100%; }
.btn:hover { opacity: .92; }
.btn.alt { background: var(--sq-g); color: var(--sq-ink); }
details.more { border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
details.more summary { cursor: pointer; padding: 9px 12px; font-weight: 700; font-size: 13.5px; list-style: none; display: flex; justify-content: space-between; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; font-weight: 800; color: var(--muted); }
details.more[open] summary::after { content: "–"; }
details.more .in { padding: 0 12px 10px; display: grid; gap: 8px; }
.opts { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.opts td { padding: 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
.opts td.n { text-align: right; white-space: nowrap; padding-left: 8px; }
.opts tr.mine td { font-weight: 700; }
.opts tr.best td:first-child::before { content: "★ "; color: var(--sq-y); }
.opts caption { text-align: left; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
.note { font-size: 12.5px; color: var(--muted); }

/* end of a spot / the day */
.endcard { display: grid; gap: 10px; text-align: center; }
.endcard h2 { margin: 0; font: 900 30px/1.05 var(--display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
.squares { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.squares .sq { width: 26px; height: 26px; font-size: 13px; }
.real { text-align: left; font-size: 13.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.big-pct { font: 900 64px/1 var(--display); letter-spacing: .01em; }
.grid-share { font: 600 15px/1.5 var(--body); white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; text-align: left; }
.countdown { font-size: 13px; color: var(--muted); }
.countdown b { font: 800 20px var(--display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .04em; }

/* play-by-play */
details.pbp summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding: 6px 0; }
#pbp { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
#pbp li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; }
#pbp .t { color: var(--muted); font-variant-numeric: tabular-nums; }
#pbp .me { font-weight: 600; }

/* modal sheets: tap-to-open boxes for anything extra */
.modal { position: fixed; inset: 0; z-index: 20; background: var(--shade); display: grid; place-items: center; padding: 16px; }
.modal .box { width: min(440px, 100%); max-height: min(86vh, 720px); overflow: auto; background: var(--card); color: var(--ink); border-radius: 12px; padding: 18px 18px 20px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.modal h2 { margin: 0 34px 10px 0; font: 900 24px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.modal .x { position: absolute; top: 10px; right: 10px; }
.modal p { margin: 0 0 10px; }
.modal .lead { font-size: 16px; }
.modal ul { margin: 0 0 10px; padding-left: 18px; display: grid; gap: 6px; }
.pinfo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; margin-bottom: 12px; }
.pinfo .chip-big { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font: 900 28px var(--display); }
.pinfo .nm { font-weight: 800; font-size: 18px; }
.pinfo .ps { color: var(--muted); font-size: 13px; }
.tier-e { background: var(--t-e); color: var(--t-e-ink); } .tier-g { background: var(--t-g); color: var(--t-g-ink); }
.tier-a { background: var(--t-a); color: var(--t-a-ink); } .tier-b { background: var(--t-b); color: var(--t-b-ink); }
.tier-p { background: var(--t-p); color: var(--t-p-ink); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; margin: 4px 0 14px; }
.stats b { display: block; font: 900 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--muted); line-height: 1.2; display: block; }
.dist { display: grid; gap: 4px; }
.dist .r { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.dist .bar { background: var(--t-a); color: var(--t-a-ink); font-weight: 700; padding: 2px 6px; text-align: right; border-radius: 2px; min-width: 22px; }
.dist .bar.hi { background: var(--sq-g); color: var(--sq-ink); }
.ex { display: flex; gap: 4px; margin: 6px 0 10px; }
.ex .sq { width: 30px; height: 30px; font-size: 14px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13.5px; margin: 0 0 10px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }
.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--paper); font-weight: 700; padding: 10px 16px; border-radius: 6px; }
.err { color: var(--sq-r); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .flip, .spin { animation: none; } .sw2::after { transition: none; } }
@media (min-width: 720px) { .wrap { padding-block: 16px 40px; } }
</style>

<header class="top">
  <div class="in">
    <button id="helpBtn" class="icon" type="button" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4.1"/><circle cx="12" cy="17.6" r=".6" fill="currentColor"/></svg>
    </button>
    <h1>Two-Minute Drill<small id="dayLabel">Daily play-calling</small></h1>
    <button id="statsBtn" class="icon" type="button" aria-label="Your stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M10 20V5M15 20v-9M20 20v-5"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <nav id="tiles" class="tiles" aria-label="Today's three spots"></nav>
  <div id="spothead" class="spothead"></div>
  <button id="board" class="board" type="button" aria-label="Game details"></button>
  <div class="fieldwrap"><svg id="field" viewBox="0 0 360 336" role="group" aria-label="The field, with every player's percentile"></svg></div>
  <div class="legend" aria-label="Percentile colors">
    <span><i class="tier-e"></i>80+</span><span><i class="tier-g"></i>60s–70s</span><span><i class="tier-a"></i>40s–50s</span><span><i class="tier-b"></i>20s–30s</span><span><i class="tier-p"></i>under 20</span><span>· tap a player</span>
  </div>
  <section id="call" class="call" aria-live="polite"></section>
  <details id="pbpBox" class="pbp"><summary>Play-by-play</summary><ol id="pbp"></ol></details>
</main>

<div id="modal" class="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button id="mClose" class="icon x" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="game.js"></script>
