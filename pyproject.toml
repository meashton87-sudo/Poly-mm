[project]
name = "polymm"
version = "0.1.0"
description = "Polymarket parlay market maker: sportsbook-derived fair value, spreads, and risk limits"
requires-python = ">=3.10"
dependencies = []  # stdlib only; `truststore` (recommended on Windows) fixes SSL cert errors

[project.optional-dependencies]
live = ["py-clob-client", "truststore"]
calibration = ["duckdb", "zstandard"]
dev = ["pytest", "duckdb", "zstandard"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["polymm", "polymm.scan"]

[tool.setuptools.package-data]
"polymm.scan" = ["fixtures/*.json", "app.html"]
