name: Two-Minute Drill leaderboard

# Tests and deploys the leaderboards and daily stats (nfl-time-management/board/worker.js) to Cloudflare Workers.
# One-time setup: add the repository secrets CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers" permission)
# and CLOUDFLARE_ACCOUNT_ID. The board lives in a Durable Object the deploy creates, so there is nothing else to make.
# Optional: `npx wrangler secret put ADMIN_TOKEN` (once, from board/) lets you remove rows. Without the secrets the
# workflow only runs the tests.
on:
  push:
    branches: [main]
    paths: ["nfl-time-management/board/**", ".github/workflows/board.yml"]
  pull_request:
    paths: ["nfl-time-management/board/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: nfl-time-management/board
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: node worker_test.mjs

      # The regular deploy lives in site.yml (the worker ships with the Pro data as its assets). Run this workflow by
      # hand (workflow_dispatch) to deploy the worker's code right away, on its own. A deploy replaces the worker's
      # whole asset set, so the manual run builds the Pro data first (about five minutes) and refuses to deploy
      # without it: the drives and runs never vanish from the worker.
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nfl-time-management/pyproject.toml
      - name: Install (manual run only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: nfl-time-management
        run: pip install -e ".[dev]"
      - id: week
        if: github.event_name == 'workflow_dispatch'
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache nflverse downloads (the site workflow's, refreshed weekly)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: nfl-time-management/data/raw
          key: site-nflverse-${{ steps.week.outputs.w }}
      - name: Build the Pro data (manual run only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: nfl-time-management
        run: |
          python -m nflclock.cli build
          python -c "from nflclock import pro; print(pro.build())"
      - name: Deploy now (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no Cloudflare token: skipped"; exit 0; fi
          rm -rf assets/pro && mkdir -p assets/pro && cp ../web/pro/*.json assets/pro/
          ls assets/pro/drives.json assets/pro/runs.json assets/pro/d0.json assets/pro/r0.json      # no Pro data, no deploy
          if [ -n "$SITE_DOMAIN" ]; then sed -i "s#^ALLOWED_ORIGINS = .*#ALLOWED_ORIGINS = \"https://$SITE_DOMAIN,https://www.$SITE_DOMAIN,https://nfl2mindrill.pages.dev,https://nfl2mindrill-pro-preview.pages.dev\"#" wrangler.toml; fi
          npx --yes wrangler@4.144.0 deploy
