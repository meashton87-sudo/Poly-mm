name: Two-Minute Drill leaderboard

# Tests and deploys the survivor leaderboard (nfl-time-management/board/worker.js) to Cloudflare Workers.
# One-time setup: create a KV namespace (`npx wrangler kv namespace create BOARD`), then add the repository secrets
# CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers" permission) and CLOUDFLARE_ACCOUNT_ID, and the
# variable BOARD_KV_ID (the namespace id). Without the secrets the workflow only runs the tests.
on:
  push:
    branches: [main]
    paths: ["nfl-time-management/board/**", ".github/workflows/board.yml"]
  pull_request:
    paths: ["nfl-time-management/board/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nfl-time-management/board
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: node worker_test.mjs

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOARD_KV_ID: ${{ vars.BOARD_KV_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$BOARD_KV_ID" ]; then
            echo "Cloudflare secrets or BOARD_KV_ID not set: tests only, no deploy."; exit 0
          fi
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$BOARD_KV_ID/" wrangler.toml
          if [ -n "$SITE_DOMAIN" ]; then sed -i "s#^ALLOWED_ORIGINS = .*#ALLOWED_ORIGINS = \"https://$SITE_DOMAIN\"#" wrangler.toml; fi
          npx --yes wrangler@3.114.0 deploy
