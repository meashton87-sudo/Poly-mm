name: Two-Minute Drill website

# Builds the daily game's data from public nflverse data (models, browser engine, the daily spots and their real
# rosters) and publishes the game to Cloudflare Pages and GitHub Pages (nfl-time-management/scripts/site.py). Runs when the game changes,
# every Tuesday (after Monday Night Football, to pick up the week's games) and on demand. Generated data is never
# committed: it lives only in the Pages artifact.
#
# The build and the checks run on every trigger; publishing to Pages is opt-in, so a site hosted elsewhere (a server
# building with scripts/site.py) never has Pages claiming its hostname. To publish here: Settings > Pages > Source:
# "GitHub Actions", and the repository variable PAGES_DEPLOY = true (Settings > Secrets and variables > Actions >
# Variables). Optional variables: SITE_DOMAIN (custom domain, e.g. nfl2mindrill.com; set only on the one host
# that serves it) and BOARD_API (the leaderboard Worker's URL; see board.yml).
on:
  push:
    branches: [main]
    paths: ["nfl-time-management/web/**", "nfl-time-management/src/**", "nfl-time-management/scripts/site.py", "nfl-time-management/board/**", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PRO_ON: "on"            # "on" launches Pro (the tab, the archive, the drives, the runs, the purchase)
      PRO_AT: ""   # and not before this time (UTC, e.g. "2026-10-16T18:00:00Z"): the page turns Pro on then; "" for at once
      VS_ON: "off"            # "on" turns on Versus (two players live) on the site; the Pro preview always has it
      FULLDEF_ON: "on"       # "on" turns on the full defensive call (personnel, front, coverage, rush) in the daily and survivor; the Pro preview always has it
    defaults:
      run:
        working-directory: nfl-time-management
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nfl-time-management/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pip install -e ".[dev]"

      - id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache nflverse downloads (refreshed weekly)
        uses: actions/cache@v4
        with:
          path: nfl-time-management/data/raw
          key: site-nflverse-${{ steps.week.outputs.w }}

      - name: Build models from nflverse play-by-play
        run: python -m nflclock.cli build

      - name: Export the browser engine and the daily game (spots, real rosters, playbook)
        run: |
          python -c "from nflclock import webexport as w; w.export_engine()"
          python -c "from nflclock import dailygame as G; print(G.build())"

      # Pro: off until approved. To launch, set PRO_ON to "on" below (one line) and merge: the historic drives and playoff
      # runs build and ship, and the site turns the Pro tab on. See nfl-time-management/board/PRO_LAUNCH.md.
      - name: Export the historic drives and playoff runs (Pro)
        id: pro
        continue-on-error: true           # before launch the daily game ships either way; the worker keeps its last Pro data
        run: python -c "from nflclock import pro; print(pro.build())"

      # nothing ships unless all of this passes: a failure here leaves the last good site up
      - name: Check the game before it ships
        run: |
          npx --yes eslint@8.57.0 --no-eslintrc -c web/eslint.json web/game.js web/motion.js web/engine.js web/game_worker.js web/vs_core.js
          node web/game_smoke.js
          node web/defense_calibration.js
          node web/motion_test.js
          node board/worker_test.mjs
          node web/game_sweep.js

      # bots play daily drives and survivor runs in a real browser on the same files, with no leaderboard and no
      # analytics (so they never show up in the real stats), and fail on any script error, freeze or stuck game
      - name: Play the game in a browser before it ships
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python scripts/site.py _site_test
          python scripts/browser_test.py _site_test --daily 6 --survivor 3 --games 2 --jobs 2 --out browser_test_out

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: nfl-time-management/browser_test_out
          if-no-files-found: ignore

      # The worker (the leaderboard, the daily stats, Pro payments) deploys from here, once the checks above pass, so the Pro data rides along as its
      # assets, served only to a valid code (board/worker.js /pro/data); board.yml only tests. Skipped when the Pro
      # data did not build: the worker keeps the data it has.
      - name: Deploy the worker with the Pro data
        if: steps.pro.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        working-directory: nfl-time-management/board
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no Cloudflare token: skipped"; exit 0; fi
          rm -rf assets/pro && mkdir -p assets/pro && cp ../web/pro/*.json assets/pro/
          # Versus: the room plays the football with the same engine and data as the site (and the 32 teams)
          rm -rf assets/vs && mkdir -p assets/vs && cp ../_site_test/engine_data.pack ../_site_test/playbook.pack ../web/teams.json assets/vs/
          node worker_test.mjs && node match_test.mjs && node lazy_sim_test.mjs && node vs_pairs_test.mjs "$GITHUB_RUN_NUMBER" && node vs_balance_test.mjs
          node vs_stress.mjs 400 "$GITHUB_RUN_NUMBER" 24       # 400 whole matches, real engine, phones misbehaving: all must check out
          if [ -n "$SITE_DOMAIN" ]; then sed -i "s#^ALLOWED_ORIGINS = .*#ALLOWED_ORIGINS = \"https://$SITE_DOMAIN,https://www.$SITE_DOMAIN,https://nfl2mindrill.pages.dev,https://nfl2mindrill-pro-preview.pages.dev\"#" wrangler.toml; fi
          npx --yes wrangler@4.144.0 deploy

      - name: Assemble the site
        run: python scripts/site.py _site --domain "${{ vars.SITE_DOMAIN }}" --board-api "${{ vars.BOARD_API }}" --ga "${{ vars.GA_ID || 'G-4QQ8N62SMB' }}" --adsense "${{ vars.ADSENSE_ID || 'ca-pub-7590842699855700' }}" --ad-slot "${{ vars.ADSENSE_SLOT }}" $([ "$PRO_ON" = on ] && echo --pro || true) $([ "$PRO_ON" = on ] && [ -n "$PRO_AT" ] && echo --pro-at "$PRO_AT" || true) $([ "$VS_ON" = on ] && echo --vs || true) $([ "$FULLDEF_ON" = on ] && echo --fulldef || true)

      # Cloudflare Pages (no bandwidth cap; project nfl2mindrill, at nfl2mindrill.pages.dev until the domain points at
      # it). Needs the CLOUDFLARE_API_TOKEN secret with the "Cloudflare Pages: Edit" permission (and
      # CLOUDFLARE_ACCOUNT_ID); without them, or if it fails, GitHub Pages still publishes.
      - name: Publish to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no Cloudflare token: skipped"; exit 0; fi
          npx --yes wrangler@4.144.0 pages project create nfl2mindrill --production-branch main 2>/dev/null || true
          npx --yes wrangler@4.144.0 pages deploy _site --project-name nfl2mindrill --branch main --commit-dirty=true

      # An unlisted preview with Pro on (nfl2mindrill-pro-preview.pages.dev; robots told to stay out), for trying Pro and
      # test-mode purchases before PRO_ON is flipped. The worker sends a buyer back to the site he came from.
      - name: Publish the Pro preview
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no Cloudflare token: skipped"; exit 0; fi
          python scripts/site.py _site_pro --board-api "${{ vars.BOARD_API }}" --site-url https://nfl2mindrill-pro-preview.pages.dev --pro --vs --fulldef
          printf 'User-agent: *\nDisallow: /\n' > _site_pro/robots.txt
          npx --yes wrangler@4.144.0 pages project create nfl2mindrill-pro-preview --production-branch main 2>/dev/null || true
          npx --yes wrangler@4.144.0 pages deploy _site_pro --project-name nfl2mindrill-pro-preview --branch main --commit-dirty=true

      - if: vars.PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: nfl-time-management/_site

  deploy:
    needs: build
    if: vars.PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
